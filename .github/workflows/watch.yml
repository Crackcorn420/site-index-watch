# Weekly URL health watch.
#
# Runs on GitHub Actions instead of a paid cron host: this repo is public, so Actions
# minutes are free and unlimited, there is no card and no cold start, and a failed run
# already emails the repo owner — so the alerting stack is the failure itself.
#
# The job FAILS when a site is broken. That is the signal. Do not add `|| true`.
name: site-index-watch

on:
  # SCHEDULE REMOVED 2026-07-27: the weekly run moved to Render (paid plan, Singapore,
  # both lenses including the Google one, which needs a credential Actions should not
  # hold). Two schedulers running the same check would double every alert email, and an
  # alert people learn to ignore is the same as no alert.
  #
  # Kept as manual-dispatch so this stays a working, credential-free second opinion —
  # useful precisely when the paid path is the thing that is broken.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every declared URL against what the host serves
        env:
          # Not committed: the site list is repository configuration, so a public repo
          # never carries it. Set via repo variable WATCH_SITES.
          WATCH_SITES: ${{ vars.WATCH_SITES }}
        run: node watch.mjs
