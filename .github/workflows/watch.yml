# Weekly URL health watch.
#
# Runs on GitHub Actions instead of a paid cron host: this repo is public, so Actions
# minutes are free and unlimited, there is no card and no cold start, and a failed run
# already emails the repo owner — so the alerting stack is the failure itself.
#
# The job FAILS when a site is broken. That is the signal. Do not add `|| true`.
name: site-index-watch

on:
  schedule:
    # Mondays 00:17 UTC = 08:17 Hong Kong. Off-the-hour on purpose: :00 is where every
    # scheduler on earth piles up, and GitHub delays cron under load at those peaks.
    - cron: "17 0 * * 1"
  workflow_dispatch:        # so it can be run on demand without waiting a week

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every declared URL against what the host serves
        env:
          # Not committed: the site list is repository configuration, so a public repo
          # never carries it. Set via repo variable WATCH_SITES.
          WATCH_SITES: ${{ vars.WATCH_SITES }}
        run: node watch.mjs
