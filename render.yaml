# Render blueprint — weekly URL health watch, no credentials required.
#
# A CRON JOB, not a background worker: this runs for ~30 seconds once a week, so a
# always-on worker would bill 24/7 to do nothing 99.99% of the time.
#
# ALERTING WITH NO SECRETS: watch.mjs exits non-zero when a site is broken, and
# Render emails the account on a failed cron run. No token, no webhook, no inbox
# integration to rot.
#
# TWO SCRIPTS, ONE RUN (added 2026-07-30): watch.mjs (credential-free live check) runs
# first, then inspect.mjs (the URL Inspection lens, needs GOOGLE_SA_JSON) runs second —
# same process tree, same log stream, so inspect.mjs's GSC_WATCH_JSON lines land AFTER
# watch.mjs's SITE_INDEX_WATCH_JSON line without either script needing to know about the
# other. `;` (not `&&`) so inspect.mjs still runs even when watch.mjs finds a broken
# site; the explicit exit-code combine at the end is what still fails the cron run (and
# triggers Render's failure email) if EITHER script failed.
services:
  - type: cron
    name: site-index-watch
    runtime: node
    plan: starter
    region: singapore          # closest to the HK audience and to the hosts being probed
    schedule: "17 0 * * 1"     # Mondays 00:17 UTC = 08:17 HKT. Off-the-hour on purpose:
                               # :00 is where every scheduler on earth piles up.
    # ⚠ THIS FILE IS NOT WHAT RUNS. This service was configured in the Render dashboard,
    # and Render ignores render.yaml for dashboard-configured services — the live build
    # and start commands come from the API. Verified 2026-07-31 against
    # GET /v1/services/crn-d9jr3f17lnhs73duulu0; the two lines below are transcribed from
    # that response so this file stops describing a service that does not exist. Editing
    # them changes NOTHING at runtime: to change the real command, PATCH the API.
    # (Before this was corrected the file claimed `npm ci` and a different exit-code
    # combine than the service actually uses.)
    buildCommand: npm install --omit=dev || true
    startCommand: "sh -c 'node watch.mjs; a=$?; node inspect.mjs; b=$?; if [ $a -ne 0 ]; then exit $a; fi; exit $b'"
    envVars:
      - key: WATCH_SITES
        sync: false          # set per-deployment; never commit the site list
      - key: GOOGLE_SA_JSON
        sync: false          # service-account JSON for inspect.mjs + gsc.mjs; never committed
